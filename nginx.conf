events {}
http {
  include /etc/nginx/mime.types;
  resolver 127.0.0.11 valid=10s ipv6=off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 80;
    client_max_body_size 100m;
    add_header X-Content-Type-Options nosniff always;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    location = /health { access_log off; return 200 'ok'; }
    location / { set $ui http://ui:80; proxy_pass $ui; }
    location /socket.io/ {
      set $socket http://socket:8084; proxy_pass $socket;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 90s;
    }
    location /media/ { alias /media/; add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location /api/ {
      rewrite ^/api/(.*) /$1 break;
      set $gateway http://gateway:8084; proxy_pass $gateway;
      proxy_buffering off; proxy_read_timeout 300s; proxy_send_timeout 300s;
    }
    location ~ ^/feeds/.+ { rewrite ^/feeds/(.*) /$1 break; set $feeds http://feed-aggregator:3010; proxy_pass $feeds; }
    location ~ ^/scheduler/.+ { rewrite ^/scheduler/(.*) /$1 break; set $scheduler http://scheduler:3011; proxy_pass $scheduler; }
  }
}
