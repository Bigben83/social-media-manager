services:
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports: ["8081:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - media_uploads:/media:ro
    networks: [socialMediaManagerNetwork]
    depends_on: [gateway, ui]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
  mongodb:
    container_name: mongodb
    image: mongo:7
    restart: unless-stopped
    ports: ["27018:27017"]
    environment:
      MONGO_INITDB_DATABASE: socialmedia
    volumes: ["mongodb-data:/data/db"]
    networks: [socialMediaManagerNetwork]
  redis:
    container_name: redis
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    networks: [socialMediaManagerNetwork]
  gateway:
    build:
      context: ./services
      dockerfile: gateway/dockerfile
    restart: unless-stopped
    env_file: .env
    volumes: ["media_uploads:/uploads"]
    networks: [socialMediaManagerNetwork]
    depends_on: [mongodb, redis]
    stop_grace_period: 150s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8084/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
  scheduler:
    build:
      context: ./services
      dockerfile: scheduler/Dockerfile
    restart: unless-stopped
    env_file: .env
    networks: [socialMediaManagerNetwork]
    depends_on: [mongodb, redis]
    stop_grace_period: 150s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3011/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
  feed-aggregator:
    build:
      context: ./services
      dockerfile: feed-aggregator/Dockerfile
    restart: unless-stopped
    env_file: .env
    networks: [socialMediaManagerNetwork]
    depends_on: [mongodb]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
  connector:
    build:
      context: ./services
      dockerfile: connector/Dockerfile
    restart: unless-stopped
    env_file: .env
    networks: [socialMediaManagerNetwork]
    depends_on: [mongodb, gateway, scheduler]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3012/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
  socket:
