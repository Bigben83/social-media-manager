name: Check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-fund
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: npm run check
        env:
          MONGO_TEST_URI: mongodb://127.0.0.1:27017
      - run: npm audit --omit=dev --audit-level=high
      - run: cp .env.example .env && docker compose config --quiet
