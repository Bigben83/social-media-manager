name: Check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-fund
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - run: cp .env.example .env && docker compose config --quiet
